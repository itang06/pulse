[package]
name = "pulse-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost-types = "0.14.4"
pulse-proto = { version = "0.1.0", path = "../pulse-proto" }
rand = "0.10.2"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync", "time", "macros"] }
tonic = "0.14.6"
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }

[lints]
workspace = true
