[package]
name = "pulse-processor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
hashlink = "0.11.1"
prometheus = "0.14.0"
prost = "0.14.4"
prost-types = "0.14.4"
pulse-proto = { version = "0.1.0", path = "../pulse-proto" }
rand = "0.10.2"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
