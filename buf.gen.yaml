# Go codegen only. Rust codegen happens at compile time via tonic-build in
# pulse-proto/build.rs; each ecosystem uses its idiomatic path.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/itang06/pulse/gateway/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gateway/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gateway/gen
    opt: paths=source_relative
