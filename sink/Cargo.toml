[package]
name = "pulse-sink"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
prost = "0.14.4"
prost-types = "0.14.4"
prometheus = "0.14.0"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
pulse-proto = { version = "0.1.0", path = "../pulse-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# NOTE: "macros" deliberately excluded; sqlx::query!() needs a live database
# (or committed offline metadata) AT COMPILE TIME, which CI doesn't have.
# Enabling the feature requires `cargo sqlx prepare` and committed .sqlx/ metadata.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "time", "uuid", "json"] }
time = "0.3"
uuid = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
